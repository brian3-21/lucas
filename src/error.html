<!--
	Página de error "dura": la que SvelteKit sirve cuando el fallo salta en `handle`,
	antes de poder renderizar componentes (validar la sesión, por ejemplo). Los fallos
	que llegan a un load o a una form action los pinta `src/routes/+error.svelte`.
	Aquí no hay Svelte ni Tailwind: solo los placeholders que rellena SvelteKit.
	Los colores son los mismos tokens que `app.css`.
-->
<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#ffffff" />
		<title>%sveltekit.error.message%</title>

		<style>
			* {
				box-sizing: border-box;
			}

			body {
				--background: oklch(1 0 0);
				--foreground: oklch(0.145 0 0);
				--muted-foreground: oklch(0.556 0 0);

				margin: 0;
				min-height: 100svh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.5rem;
				padding: 1rem;
				text-align: center;
				background: var(--background);
				color: var(--foreground);
				font-family:
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					Oxygen,
					Ubuntu,
					Cantarell,
					'Open Sans',
					'Helvetica Neue',
					sans-serif;
			}

			.status {
				margin: 0;
				font-size: 3.75rem;
				line-height: 1;
				font-weight: 600;
				letter-spacing: -0.025em;
				font-variant-numeric: tabular-nums;
				color: var(--muted-foreground);
			}

			.message {
				margin: 0;
				max-width: 24rem;
				font-size: 0.875rem;
				line-height: 1.4;
				color: var(--muted-foreground);
			}

			@media (prefers-color-scheme: dark) {
				body {
					--background: oklch(0.145 0 0);
					--foreground: oklch(0.985 0 0);
					--muted-foreground: oklch(0.708 0 0);
				}
			}
		</style>
	</head>
	<body>
		<p class="status">%sveltekit.status%</p>
		<p class="message">%sveltekit.error.message%</p>
	</body>
</html>
